<svg xmlns="http://www.w3.org/2000/svg" width="80" height="32" viewBox="0 0 80 32" shape-rendering="crispEdges">
  <!-- Nine true 16x16 module textures using an upright leather-template silhouette. -->
  <defs>
    <g id="template">
      <!-- vertical red-brown tablet with the vanilla-like short bottom tab -->
      <path fill="#2b140b" d="M4 1h8v1h1v12h-2v1h-1v1H6v-1H5v-1H3V2h1z"/>
      <path fill="#3d1c10" d="M4 1h8v1h1v11h-2v2H6v-1H4z"/>
      <path fill="#893b25" d="M5 2h7v9h-1v3H6v-2H5z"/>
      <path fill="#c65c35" d="M6 2h6v4H6z"/>
      <path fill="#d76b43" d="M7 2h4v1H7z"/>
      <path fill="#542716" d="M4 6h2v5H5v2H4zm8 0h1v7h-2v-2h1z"/>
      <path fill="#3d1c10" d="M6 5h5v1h1v5h-1v2H6v-2H5V7h1z"/>
      <rect fill="#9e492a" x="5" y="8" width="1" height="3"/>
      <rect fill="#b95332" x="10" y="11" width="2" height="2"/>
      <rect fill="#542716" x="7" y="14" width="3" height="1"/>
    </g>
  </defs>

  <!-- 1 crafting: compact 3x3 grid -->
  <g transform="translate(0 0)"><use href="#template"/>
    <rect fill="#49342d" x="6" y="5" width="5" height="7"/>
    <rect fill="#9e7652" x="6" y="5" width="5" height="1"/>
    <path fill="#74533e" d="M6 7h5v1H6zm0 2h5v1H6zM7 6h1v6H7zm2 0h1v6H9z"/>
    <rect fill="#bea071" x="6" y="6" width="1" height="1"/><rect fill="#bea071" x="8" y="8" width="1" height="1"/>
  </g>

  <!-- 2 compaction: piston pressing ore downward -->
  <g transform="translate(16 0)"><use href="#template"/>
    <rect fill="#bbb9af" x="6" y="5" width="5" height="2"/>
    <rect fill="#858681" x="6" y="7" width="5" height="1"/>
    <rect fill="#aaa9a1" x="8" y="8" width="2" height="3"/>
    <rect fill="#6d6d68" x="6" y="10" width="5" height="1"/>
    <path fill="#8f634b" d="M7 11h3v2H7z"/><rect fill="#ba8b68" x="8" y="11" width="1" height="1"/>
    <rect fill="#9e4d48" x="6" y="8" width="1" height="2"/>
  </g>

  <!-- 3 matching pickup: matching items fall into hopper -->
  <g transform="translate(32 0)"><use href="#template"/>
    <rect fill="#d5d0c2" x="6" y="5" width="2" height="2"/><rect fill="#9d9a90" x="7" y="6" width="1" height="1"/>
    <rect fill="#d5d0c2" x="9" y="5" width="2" height="2"/><rect fill="#9d9a90" x="10" y="6" width="1" height="1"/>
    <path fill="#777a78" d="M6 8h5v2h-1v1H9v2H8v-2H7v-1H6z"/>
    <path fill="#454644" d="M7 9h3v1H7z"/>
    <rect fill="#69aaa5" x="8" y="7" width="1" height="1"/><rect fill="#69aaa5" x="9" y="7" width="1" height="1"/>
  </g>

  <!-- 4 single-use soulbound: centered idol and broken link -->
  <g transform="translate(48 0)"><use href="#template"/>
    <rect fill="#c7ad68" x="7" y="4" width="3" height="2"/><rect fill="#ded2a6" x="8" y="4" width="1" height="1"/>
    <path fill="#a4863e" d="M6 6h5v4h-1v3H9v-2H8v2H7v-3H6z"/>
    <rect fill="#73a67d" x="7" y="6" width="1" height="1"/><rect fill="#73a67d" x="9" y="6" width="1" height="1"/>
    <rect fill="#c0a05a" x="6" y="8" width="1" height="1"/><rect fill="#c0a05a" x="10" y="8" width="1" height="1"/>
    <rect fill="#79618e" x="10" y="11" width="1" height="1"/><rect fill="#9b79ae" x="10" y="10" width="1" height="1"/>
  </g>

  <!-- 5 blast+cactus: vertical split -->
  <g transform="translate(0 16)"><use href="#template"/>
    <rect fill="#a95045" x="5" y="7" width="3" height="5"/>
    <rect fill="#d8cfbd" x="5" y="9" width="3" height="1"/><rect fill="#742f30" x="6" y="10" width="1" height="1"/>
    <rect fill="#b6753c" x="6" y="5" width="1" height="2"/><rect fill="#d3b66b" x="6" y="4" width="1" height="1"/>
    <rect fill="#496f47" x="9" y="5" width="2" height="7"/><rect fill="#71945b" x="10" y="5" width="1" height="7"/>
    <rect fill="#a7b889" x="8" y="7" width="1" height="1"/><rect fill="#a7b889" x="11" y="9" width="1" height="1"/>
  </g>

  <!-- 6 fire: straight rising flame -->
  <g transform="translate(16 16)"><use href="#template"/>
    <path fill="#833f30" d="M8 4h2v3h1v1h1v4h-1v1H6v-1H5V9h1V7h1v2h1z"/>
    <path fill="#b76a3d" d="M9 5h1v4h1v3H7V9h1V7h1z"/>
    <path fill="#d5a958" d="M9 8h1v2h1v2H8v-1h1z"/><rect fill="#ddd1a2" x="9" y="11" width="1" height="1"/>
  </g>

  <!-- 7 despawn protection: centered clock and retaining arrow -->
  <g transform="translate(32 16)"><use href="#template"/>
    <!-- gold clock with a dark face and high-contrast hands -->
    <path fill="#80683f" d="M7 6h3v1h1v4h-1v1H7v-1H6V7h1z"/>
    <path fill="#b69b62" d="M7 6h3v1h1v3h-1v2H7v-1H6V7h1z"/>
    <rect fill="#625f57" x="7" y="7" width="3" height="3"/>
    <path fill="#d8d0b8" d="M8 7h1v2h1v1H8z"/>
    <rect fill="#d9c98f" x="7" y="6" width="2" height="1"/>
  </g>

  <!-- 8 void protection: upright obsidian rift -->
  <g transform="translate(48 16)"><use href="#template"/>
    <path fill="#302438" d="M7 4h4v1h1v7h-1v1H7v-1H6V5h1z"/>
    <path fill="#5f476f" d="M7 5h4v1h1v5h-1v1H7v-1H6V6h1z"/>
    <path fill="#806693" d="M7 5h2v1H8v5H7zM10 6h1v5h-1z"/>
    <path fill="#3f7777" d="M8 6h2v1h1v3h-1v1H8V9H7V7h1z"/>
    <path fill="#68aaa3" d="M8 7h2v1h1v1h-1v1H8z"/>
    <rect fill="#294646" x="8" y="8" width="2" height="2"/>
    <rect fill="#9a73a9" x="7" y="12" width="1" height="1"/><rect fill="#735b84" x="10" y="13" width="1" height="1"/>
  </g>

  <!-- 9 capacity expansion: stacked storage rows with an inset plus -->
  <g transform="translate(64 0)"><use href="#template"/>
    <rect fill="#4c4035" x="6" y="5" width="5" height="7"/>
    <rect fill="#b7aa8d" x="6" y="6" width="4" height="1"/>
    <rect fill="#8f8571" x="6" y="8" width="3" height="1"/>
    <rect fill="#b7aa8d" x="6" y="10" width="4" height="1"/>
    <path fill="#82977b" d="M10 7h1v2h1v1h-1v2h-1v-2H9V9h1z"/>
    <rect fill="#a6b39b" x="10" y="9" width="1" height="1"/>
  </g>
</svg>
