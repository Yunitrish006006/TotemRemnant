plugins {
    id 'fabric-loom' version '1.17.12'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

// A Loom run is launched from Gradle's JVM, whose environment may have been
// captured before a shell-scoped variable was added. Accept Gradle properties
// as the deterministic CI transport while retaining the documented env-var
// interface for direct invocations.
def remnantRestartProbePhase = providers.gradleProperty("totemRemnantRestartProbePhase")
        .orElse(providers.environmentVariable("TOTEM_REMNANT_RESTART_PROBE_PHASE"))
        .orNull
def remnantRestartProbeMarkerDirectory = providers.gradleProperty("totemRemnantRestartProbeMarkerDir")
        .orElse(providers.environmentVariable("TOTEM_REMNANT_RESTART_PROBE_MARKER_DIR"))
        .orNull
def totemCoreJar = file(providers.gradleProperty("totemCoreJar")
        .getOrElse("../TotemCore/build/libs/totem-core-0.7.22.jar"))

loom {
    splitEnvironmentSourceSets()

    mods {
        'totem-remnant' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "totem-remnant-gametest"
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

loom {
    runs {
        remnantRestartProbe {
            server()
            setConfigName("TotemRemnant Restart Probe")
            ideConfigGenerated(false)
            runDir("run/remnantRestartProbe")
            source sourceSets.gametest
            programArg("--nogui")
            if (remnantRestartProbePhase != null) {
                environmentVariable("TOTEM_REMNANT_RESTART_PROBE_PHASE", remnantRestartProbePhase)
            }
            if (remnantRestartProbeMarkerDirectory != null) {
                environmentVariable("TOTEM_REMNANT_RESTART_PROBE_MARKER_DIR", remnantRestartProbeMarkerDirectory)
            }
        }
    }
}

tasks.named("runRemnantRestartProbe").configure {
    doFirst {
        File runDirectory = file("run/remnantRestartProbe")
        runDirectory.mkdirs()
        new File(runDirectory, "eula.txt").text = "eula=true\n"
    }
}

// Loom serializes run environments into the DLI configuration. Make the
// phase/marker inputs explicit so separate seed and verify invocations cannot
// reuse the previous JVM's generated launch environment.
tasks.named("generateDLIConfig").configure {
    inputs.property("totemRemnantRestartProbePhase", remnantRestartProbePhase ?: "")
    inputs.property("totemRemnantRestartProbeMarkerDirectory", remnantRestartProbeMarkerDirectory ?: "")
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.codemc.io/repository/relativitymc/' }
    maven { url = 'https://maven.nucleoid.xyz/releases' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "org.relativitymc:modern-yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    compileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    runtimeOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly "eu.pb4:trinkets:4.2.0+26.3"
    compileOnly "dev.yumi.mc.core:yumi-mc-foundation:1.1.3+26.1"

    // Keep Core as a real external Fabric module. Embedding its sources made
    // standalone verification accidentally test a second in-project mod instead
    // of the artifact Remnant will consume in a compatibility bundle.
    modImplementation files(totemCoreJar)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def totemVisualModuleJars = providers.gradleProperty('totemVisualModuleJars').orNull
if (totemVisualModuleJars != null && !totemVisualModuleJars.isBlank()) {
    dependencies {
        totemVisualModuleJars.split(',').each { moduleJar ->
            modRuntimeOnly files(file(moduleJar.trim()))
        }
    }
}

tasks.withType(Test).configureEach { useJUnitPlatform() }

tasks.matching { task -> task.name == "runClientGameTest" }.configureEach {
    doLast {
        copy {
            from(file("${buildDir}/run/clientGameTest/screenshots"))
            include("*_totem-remnant-creative-showcase.png")
            rename { name -> name.replaceFirst(/^\d+_/, "") }
            into(file("test-artifacts/screenshots/creative-tab"))
        }
        copy {
            from(file("${buildDir}/run/clientGameTest/screenshots"))
            include("*_backpack-dyeing-four-tiers.png")
            rename { name -> name.replaceFirst(/^\d+_/, "") }
            into(file("test-artifacts/screenshots/backpack-dyeing"))
        }
        copy {
            from(file("${buildDir}/run/clientGameTest/screenshots"))
            include("*_inventory-backpack-side-panel*.png")
            rename { name -> name.replaceFirst(/^\d+_/, "") }
            into(file("test-artifacts/screenshots/backpack-inventory"))
        }
        copy {
            from(file("${buildDir}/run/clientGameTest/screenshots"))
            include("*_backpack-upgrade-bay.png", "*_backpack-upgrade-bay-no-crafting.png")
            include("*_backpack-ender-access-zh-tw.png", "*_backpack-ender-access-en-us.png")
            include("*_backpack-crafting-result-before-click.png",
                    "*_backpack-crafting-result-after-click.png")
            rename { name -> name.replaceFirst(/^\d+_/, "") }
            into(file("test-artifacts/screenshots/backpack-inventory"))
        }
        copy {
            from(file("${buildDir}/run/clientGameTest/screenshots"))
            include("*_backpack-capacity-*-modules.png")
            include("*_backpack-capacity-small-screen-scrolled.png")
            rename { name -> name.replaceFirst(/^\d+_/, "") }
            into(file("test-artifacts/screenshots/backpack-inventory"))
        }
        copy {
            from(file("${buildDir}/run/clientGameTest/screenshots"))
            include("*_backpack-upgrade-recipes.png")
            rename { name -> name.replaceFirst(/^\d+_/, "") }
            into(file("test-artifacts/screenshots/backpack-recipes"))
        }
    }
}

def namedRuntimeSources = new LinkedHashSet<File>()
def namedRuntimeCopies = [:]
def namedRuntimeCopyFor = { File source ->
    namedRuntimeCopies.computeIfAbsent(source.absolutePath) {
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(source.bytes).encodeHex().toString()
        layout.buildDirectory.file("named-runtime-api/v2/${digest}-${source.name}").get().asFile
    }
}
tasks.register('normalizeFabricApiTweakersForNamedDevRuntime') {
    group = 'fabric'
    description = 'Creates isolated named-namespace Fabric API copies for development runs.'
    inputs.files(provider { namedRuntimeSources })
    outputs.dir(layout.buildDirectory.dir('named-runtime-api/v2'))
    doLast {
        def outputDir = layout.buildDirectory.dir('named-runtime-api/v2').get().asFile
        outputDir.mkdirs()
        namedRuntimeSources.each { jarFile ->
            def zip = new java.util.zip.ZipFile(jarFile)
            try {
                def changes = [:]
                zip.entries().each { entry ->
                    if (!entry.directory && (entry.name.endsWith('.classtweaker') || entry.name.endsWith('.accesswidener'))) {
                        def original = zip.getInputStream(entry).getText('UTF-8')
                        def normalized = original.replaceFirst(/(?m)^((?:classTweaker|accessWidener)\s+v\d+\s+)official(\s*)$/, '$1named$2')
                        if (normalized != original) changes[entry.name] = normalized.getBytes('UTF-8')
                    }
                }
                def copy = namedRuntimeCopyFor(jarFile)
                if (!copy.isFile()) {
                    def temporary = new File(copy.parentFile, copy.name + ".tmp")
                    def out = new java.util.zip.ZipOutputStream(new FileOutputStream(temporary))
                    try {
                        zip.entries().each { entry ->
                            out.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                            if (!entry.directory) out.write(changes[entry.name] ?: zip.getInputStream(entry).bytes)
                            out.closeEntry()
                        }
                    } finally { out.close() }
                    java.nio.file.Files.move(temporary.toPath(), copy.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING, java.nio.file.StandardCopyOption.ATOMIC_MOVE)
                }
            } finally { zip.close() }
        }
        logger.lifecycle("Prepared ${namedRuntimeCopies.size()} isolated named-runtime API copies.")
    }
}

afterEvaluate {
    tasks.withType(net.fabricmc.loom.task.RunGameTask).all { runTask ->
        dependsOn('normalizeFabricApiTweakersForNamedDevRuntime')
        def classpathProducers = classpath.buildDependencies.getDependencies(runTask).toList()
        dependsOn(classpathProducers)
        def originals = classpath.files.toList()
        def copies = originals.collect { file ->
            if (file.absolutePath.contains('/net.fabricmc.fabric-api/') && file.name.endsWith('.jar')) {
                namedRuntimeSources.add(file)
                return namedRuntimeCopyFor(file)
            }
            return file
        }
        setClasspath(files(copies))
    }
}

java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
tasks.named('processResources', ProcessResources) {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
    // zh_cn intentionally reuses zh_tw; maintain only the Traditional Chinese source.
    doLast {
        copy {
            from(file('src/main/resources/assets/totem/lang/zh_tw.json'))
            into(file("${destinationDir}/assets/totem/lang"))
            rename { 'zh_cn.json' }
        }
    }
}

// A lockstep artifact is pinned by SHA-512, so its bytes must not depend on
// filesystem timestamps or Loom's host-dependent manifest entry ordering.
// `jar` is Loom's development JAR; the production JAR installed in
// `build/libs` is emitted by `remapJar`. Normalize both so development and
// lockstep production builds use the same deterministic archive procedure.
def normalizeArchive = { File archive ->
        def replacement = new File(archive.parentFile, "${archive.name}.normalized")
        def source = new java.util.jar.JarFile(archive)

        try {
            def sourceManifest = source.manifest
            def normalizedManifest = new java.util.jar.Manifest()
            def attributes = sourceManifest.mainAttributes
            normalizedManifest.mainAttributes.putValue(
                    'Manifest-Version',
                    attributes.getValue('Manifest-Version') ?: '1.0'
            )

            attributes.keySet()
                    .collect { it.toString() }
                    .findAll { it != 'Manifest-Version' }
                    .sort()
                    .each { name ->
                        def value = attributes.getValue(name)
                        if (name == 'Fabric-Loom-Client-Only-Entries') {
                            value = value.split(';').findAll { it }.sort().join(';')
                        }
                        normalizedManifest.mainAttributes.putValue(name, value)
                    }

            def entries = []
            def enumeration = source.entries()
            while (enumeration.hasMoreElements()) {
                entries << enumeration.nextElement()
            }

            def output = new java.util.jar.JarOutputStream(
                    new java.io.FileOutputStream(replacement)
            )
            try {
                def manifestEntry = new java.util.zip.ZipEntry('META-INF/MANIFEST.MF')
                manifestEntry.setTime(0L)
                output.putNextEntry(manifestEntry)
                normalizedManifest.write(output)
                output.closeEntry()

                entries.findAll { it.name != 'META-INF/MANIFEST.MF' }
                        .sort { it.name }
                        .each { entry ->
                            def normalizedEntry = new java.util.zip.ZipEntry(entry.name)
                            normalizedEntry.setTime(0L)
                            output.putNextEntry(normalizedEntry)
                            if (!entry.directory) {
                                source.getInputStream(entry).withCloseable { input ->
                                    input.transferTo(output)
                                }
                            }
                            output.closeEntry()
                        }
            } finally {
                output.close()
            }
        } finally {
            source.close()
        }

        java.nio.file.Files.move(
                replacement.toPath(),
                archive.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
}

tasks.named('jar', Jar) {
    preserveFileTimestamps = false
    reproducibleFileOrder = true

    doLast {
        normalizeArchive(archiveFile.get().asFile)
    }
}

tasks.named('remapJar') {
    doLast {
        normalizeArchive(archiveFile.get().asFile)
    }
}
